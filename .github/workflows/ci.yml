name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No DATABASE_URL here, so the build skips migrations and just compiles.
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-not-a-real-secret-0000000000
